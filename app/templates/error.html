{% extends "base.html" %}
{% block title %}{{ title }} · AERIS-MK2{% endblock %}
{% block content %}
<section class="panel error-panel">
  <div class="eyebrow">REQUEST NOT COMPLETED</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  {% if session.get("username") %}
  <a class="button button-primary" href="{{ url_for('main.dashboard') }}">Return to overview</a>
  {% else %}
  <a class="button button-primary" href="{{ url_for('auth.login') }}">Return to sign in</a>
  {% endif %}
</section>
{% endblock %}
